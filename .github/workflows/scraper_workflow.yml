name: Scheduled Web Scraper

# Controls when the workflow will run
on:
  schedule:
    # Runs at 08:00 UTC every day (Cron syntax)
    - cron: '0 8 * * *'
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/python-versions@v5
      with:
        python-version: '3.11'

    # Step 3: Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run the scraper script
    - name: Run Scraper
      run: python scraper.py

    # Step 5: Commit and push generated CSV back to repository
    - name: Commit and Push Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.csv
        git commit -m "Auto-update scraped data [skip ci]" || exit 0
        git push